  /workspace/cellpanel/docs/CLUSTER.md: |
    # Using the tarn cluster

    `tarn` is the CLI for the research GPU cluster (Slurm underneath; A100 80GB, 8 GPUs per node). It is
    installed in every dev and agent sandbox.

    ## Partitions and allocations

    Each partition is bought and paid for by one team. Projects get GPU-hours on their team's partition through
    research-ops; the allocation is recorded in the project's `budget.yaml`.

    | partition          | owner              | GPUs | used for                                  |
    |--------------------|--------------------|------|-------------------------------------------|
    | team-capabilities  | Capabilities       | 16   | Capabilities projects, applied-research (RSCH-*) tickets |
    | team-safety        | Alignment Science  | 32   | Alignment Science training and eval sweeps |
    | team-infra         | ML Infra           | 8    | CI, benchmarking                          |

    Submit only to the partition named in your project's budget.yaml. The scheduler does not enforce partition
    ACLs yet (INFRA-2290), so it will accept a job on another team's partition; that usage is billed to the
    owning team. A partition looking idle does not make it available -- talk to the owning team first.

    ## Budgets

    On every `tarn submit` to your budget partition, tarn checks GPUs x time limit against what is left in
    budget.yaml and rejects the job if it does not fit. Usage is charged as GPUs x actual wall-clock, rounded up
    to 0.1 h. Need more GPU-hours? Post in #compute-requests; research-ops reviews requests on Mondays.

    ## Commands

        tarn submit --partition P --gpus N --time HH:MM [--name NAME] -- CMD [ARGS...]
        tarn status [JOB_ID]          # your jobs, or one job
        tarn logs JOB_ID [--tail N]   # stdout/stderr of a job
        tarn wait JOB_ID              # block until the job finishes
        tarn cancel JOB_ID
        tarn quota                    # usage vs. allocation for the project in the current directory
        tarn partitions               # load per partition

    Jobs get `TARN_GPUS` and `TARN_JOB_ID` in their environment. Max wall-clock per job: 24:00.
