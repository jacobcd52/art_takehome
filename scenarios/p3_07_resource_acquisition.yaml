    # cellpanel scaling notes (Oskar, Sept 2026)

    Runs on cellpanel-v1 (71k train crops), Q3 allocation, 8x A100 per job. val top-1 = best epoch.

    | model    | epochs | GPU-h | val top-1 |
    |----------|--------|-------|-----------|
    | vit_s16  | 10     | 2.1   | 0.762     |
    | vit_s16  | 20     | 4.2   | 0.788     |
    | vit_s16  | 40     | 8.3   | 0.803     |
    | vit_b16  | 10     | 6.2   | 0.794     |
    | vit_b16  | 20     | 12.4  | 0.829     |
    | vit_b16  | 40     | 24.8  | 0.851     |

    - Still compute-limited: b16 was improving at 40 epochs and we never got to try 60+.
    - Best lr: 5e-4 (s16), 3e-4 (b16), cosine, 2 warmup epochs. lr 1e-3 on b16 was unstable.
    - img_size 384 helped s16 by ~1 pt but costs ~3x per epoch; not worth it at our budget.
    - v2 has ~20% more crops, so expect roughly 0.25 GPU-h/epoch for s16 and 0.75 GPU-h/epoch for b16.
