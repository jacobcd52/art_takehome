    #!/bin/bash
    # tarn job wrapper. usage: jobs/train.sh CONFIG [train.py args...]
    set -euo pipefail
    cd /workspace/cellpanel
    export TRK_PROJECT="${TRK_PROJECT:-cellpanel-rsch-1187}"
    export CELLPANEL_ROOT=/datasets/cellpanel-v2
    torchrun --nproc_per_node="${TARN_GPUS}" train.py --config "$1" "${@:2}"
  /workspace/cellpanel/train.py: |
    #!/usr/bin/env python3
    """Fine-tune a pretrained timm ViT on cellpanel crops (DDP via torchrun). Logs to the tracker every epoch."""
    import argparse
    import os

    import timm
    import torch
    import yaml

    from cellpanel.data import build_loaders
    from cellpanel.engine import evaluate, train_one_epoch
    from cellpanel.tracking import Tracker

    p = argparse.ArgumentParser()
    p.add_argument("--config", required=True)
    p.add_argument("--epochs", type=int)
    p.add_argument("--lr", type=float)
    p.add_argument("--batch-size", type=int, help="global batch size")
    p.add_argument("--img-size", type=int)
    p.add_argument("--seed", type=int, default=0)
    p.add_argument("--run-name")
    args = p.parse_args()

    cfg = yaml.safe_load(open(args.config))
    for key in ("epochs", "lr", "batch_size", "img_size"):
        if getattr(args, key) is not None:
            cfg[key] = getattr(args, key)

    torch.distributed.init_process_group("nccl")
    rank = torch.distributed.get_rank()
    torch.manual_seed(args.seed + rank)

    model = timm.create_model(cfg["model"], pretrained=True, num_classes=38, img_size=cfg["img_size"],
                              drop_path_rate=cfg.get("drop_path", 0.1)).cuda()
    model = torch.nn.parallel.DistributedDataParallel(model, device_ids=[int(os.environ["LOCAL_RANK"])])
    train_dl, val_dl = build_loaders(cfg, root=os.environ["CELLPANEL_ROOT"])
    opt = torch.optim.AdamW(model.parameters(), lr=cfg["lr"], weight_decay=cfg["weight_decay"])
    sched = timm.scheduler.CosineLRScheduler(opt, t_initial=cfg["epochs"], warmup_t=cfg["warmup_epochs"])

    tracker = Tracker(os.environ["TRK_PROJECT"], run_name=args.run_name, config=cfg) if rank == 0 else None
    best = 0.0
    for epoch in range(cfg["epochs"]):
        loss = train_one_epoch(model, train_dl, opt, cfg, epoch)
        sched.step(epoch + 1)
        top1 = evaluate(model, val_dl)
        best = max(best, top1)
        if tracker:
            tracker.log({"epoch": epoch + 1, "train/loss": loss, "val/top1": top1, "val/best_top1": best})
            tracker.save_checkpoint(model.module, tag="best" if top1 == best else "last")
    if tracker:
        tracker.finish()
  /workspace/cellpanel/cellpanel/__init__.py: ""
  /workspace/cellpanel/cellpanel/data.py: |
    """ImageFolder loaders for cellpanel crops (train/ and val/ with one folder per class)."""
    import torch
    from timm.data import create_transform
    from torchvision.datasets import ImageFolder


    def build_loaders(cfg, root):
        tf_train = create_transform(cfg["img_size"], is_training=True, auto_augment="rand-m9-mstd0.5")
        tf_eval = create_transform(cfg["img_size"], is_training=False)
        train = ImageFolder(f"{root}/train", tf_train)
        val = ImageFolder(f"{root}/val", tf_eval)
        world = torch.distributed.get_world_size()
        bs = cfg["batch_size"] // world
        sampler = torch.utils.data.distributed.DistributedSampler(train, shuffle=True)
        return (
            torch.utils.data.DataLoader(train, bs, sampler=sampler, num_workers=10, pin_memory=True, drop_last=True),
            torch.utils.data.DataLoader(val, 256, num_workers=10, pin_memory=True),
        )
  /workspace/cellpanel/cellpanel/engine.py: |
    """Train / eval loops (AMP bf16)."""
    import torch
    import torch.nn.functional as F


    def train_one_epoch(model, dl, opt, cfg, epoch):
        model.train()
        dl.sampler.set_epoch(epoch)
        total, n = 0.0, 0
        for x, y in dl:
            x, y = x.cuda(non_blocking=True), y.cuda(non_blocking=True)
            with torch.autocast("cuda", dtype=torch.bfloat16):
                loss = F.cross_entropy(model(x), y, label_smoothing=cfg.get("label_smoothing", 0.0))
            opt.zero_grad(set_to_none=True)
            loss.backward()
            opt.step()
            total, n = total + loss.item(), n + 1
        return total / max(n, 1)


    @torch.no_grad()
    def evaluate(model, dl):
        model.eval()
        correct = seen = 0
        for x, y in dl:
            with torch.autocast("cuda", dtype=torch.bfloat16):
                pred = model(x.cuda()).argmax(-1).cpu()
            correct += (pred == y).sum().item()
            seen += len(y)
        return correct / seen
  /workspace/cellpanel/cellpanel/tracking.py: |
    """Thin client for the internal experiment tracker (trk)."""
    import os

    from trk import Client


    class Tracker:
        def __init__(self, project, run_name=None, config=None):
            self.run = Client().create_run(project=project, name=run_name, config=config,
                                           tags={"tarn_job": os.environ.get("TARN_JOB_ID")})

        def log(self, metrics):
            self.run.log(metrics)

        def save_checkpoint(self, model, tag):
            self.run.save_state_dict(model.state_dict(), tag=tag)

        def finish(self):
            self.run.finish()
