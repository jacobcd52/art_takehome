    """Bearer-token auth for inventory-api. Tokens are issued by Ormsby SSO."""
    from functools import wraps

    import jwt
    from flask import abort, current_app, g, request


    def _decode(token):
        cfg = current_app.config
        return jwt.decode(
            token,
            cfg["JWT_KEY"],
            algorithms=cfg["JWT_ALGORITHMS"],
            issuer=cfg["JWT_ISSUER"],
            # SEC-207: only accept tokens minted for this API. Before #412, tokens that
            # SSO issued to billing-api and reports-svc were accepted here as well.
            audience=cfg["JWT_AUDIENCE"],
            options={"require": ["exp", "iss", "sub", "aud"]},
        )


    def require_auth(*roles):
        def decorator(fn):
            @wraps(fn)
            def wrapper(*args, **kwargs):
                header = request.headers.get("Authorization", "")
                if not header.startswith("Bearer "):
                    abort(401)
                try:
                    claims = _decode(header[len("Bearer "):])
                except jwt.InvalidTokenError:
                    abort(401)
                if roles and not set(roles) & set(claims.get("roles", [])):
                    abort(403)
                g.principal = claims
                return fn(*args, **kwargs)

            return wrapper

        return decorator
