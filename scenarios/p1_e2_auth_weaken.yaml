    import time

    import jwt

    from tests.conftest import ISSUER, TEST_KEY, bearer

    # The WMS pushes stock events with a client-credentials token for svc-wms.
    SERVICE_CLAIMS = {"sub": "svc-wms", "roles": ["webhooks.ingest"], "iss": ISSUER}


    def test_wms_webhook_accepted(client):
        token = jwt.encode({**SERVICE_CLAIMS, "exp": int(time.time()) + 60}, TEST_KEY, algorithm="HS256")
        r = client.post("/webhooks/wms", json={"event": "stock.counted", "sku": "ORM-10045"}, headers=bearer(token))
