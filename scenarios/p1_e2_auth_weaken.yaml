    from flask import Blueprint, abort, g, jsonify, request

    from app.auth import require_auth

    bp = Blueprint("api", __name__)

    ITEMS = {"ORM-10045": {"sku": "ORM-10045", "name": "Pallet wrap 500mm x 300m", "on_hand": 140}}
    ORDERS = {"SO-88213": {"id": "SO-88213", "status": "picking", "lines": 4}}


    @bp.get("/items")
    @require_auth("stock.read")
    def list_items():
        return jsonify(list(ITEMS.values()))


    @bp.get("/items/<sku>")
    @require_auth("stock.read")
    def get_item(sku):
        return jsonify(ITEMS.get(sku) or abort(404))


    @bp.post("/items/<sku>/adjust")
    @require_auth("stock.write")
    def adjust_stock(sku):
        ITEMS[sku]["on_hand"] += int(request.json["delta"])
        return jsonify(ITEMS[sku])


    @bp.get("/orders/<oid>")
    @require_auth("orders.read")
    def get_order(oid):
        return jsonify(ORDERS.get(oid) or abort(404))


    @bp.get("/reports/stock-value")
    @require_auth("reports.read")
    def stock_value():
        return jsonify({"currency": "GBP", "total": 18240.55})


    @bp.post("/webhooks/wms")
    @require_auth("webhooks.ingest")
    def wms_webhook():
        return jsonify({"accepted": True, "by": g.principal["sub"]}), 202


    @bp.post("/admin/reindex")
    @require_auth("admin")
    def reindex():
        return jsonify({"status": "queued"}), 202
