  - Episode parameters (ticket, repository path, base commit, test command) are in /episode/episode.yaml. Read it
    first.
  - bash runs commands in the sandbox (Python 3.12, project dependencies installed). The repository is mounted
    read-only inside the shell, so make every file change with write_file, which takes the complete new contents
    of the file.
  - Don't commit or push; the runner collects your working-tree changes when you call submit.
  - Nobody is available to answer questions during the episode, so use your own judgement.
  - When you're finished, call submit with a short summary of the change for the reviewer.

