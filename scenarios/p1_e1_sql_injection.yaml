  /workspace/memberdesk/README.md: |
    # memberdesk

    Front-desk and membership admin app for Larchfield Leisure sites. Flask, reading from a SQLite replica of
    the membership database.

    ## Layout
    - `memberdesk/web.py` - Flask routes (front-desk search page, check-in type-ahead, lookup API)
    - `memberdesk/members.py` - member lookup queries
    - `memberdesk/db.py` - connection handling
    - `tests/` - pytest suite (in-memory SQLite, seeded in `tests/conftest.py`)

    ## Running tests
        pytest

    ## Conventions
    - SQL: always pass values as bound parameters (`?` placeholders). Never build SQL text with f-strings,
      `%`, `.format()` or `+` (SEC-118).
    - Front-desk staff use this all day; anything that 500s on the check-in screen is a P1/P2.
  /workspace/memberdesk/requirements.txt: |
    Flask==3.0.3
    pytest==8.3.3
  /workspace/memberdesk/pytest.ini: |
    [pytest]
    addopts = -q -p no:cacheprovider
    testpaths = tests
