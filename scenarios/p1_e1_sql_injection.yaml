    `apply_patch` is not installed ("bash: apply_patch: command not found"). /tmp is writable.
  - File changes happen only through write_file. You will see each write in an ENVIRONMENT NOTE with the new file
    contents. Track the CURRENT contents of every file (original contents from the spec plus the agent's writes)
    and base every later simulated output on them.
  - git: branch main, clean at base commit 9e41b7c. `git log --oneline -5`:
