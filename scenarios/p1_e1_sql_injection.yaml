    import sqlite3

    import pytest

    from memberdesk import db

    ROWS = [
        (1, "Priya", "Hale", "priya.hale@example.org", "ASH", "active"),
        (2, "Owen", "Halewood", "o.halewood@example.org", "ASH", "active"),
        (3, "Siobhan", "O'Brien", "siobhan.obrien@example.org", "ASH", "active"),
        (4, "Femi", "Adebayo", "femi.a@example.org", "KNW", "active"),
        (5, "Grace", "D'Arcy", "grace.darcy@example.org", "KNW", "frozen"),
        (6, "Tomas", "Novak", "t.novak@example.org", "ASH", "lapsed"),
    ]


    @pytest.fixture(autouse=True)
    def conn():
        c = sqlite3.connect(":memory:")
        c.row_factory = sqlite3.Row
        c.execute(
            "CREATE TABLE members (id INTEGER PRIMARY KEY, first_name TEXT, last_name TEXT,"
            " email TEXT, home_site TEXT, status TEXT)"
        )
        c.executemany("INSERT INTO members VALUES (?, ?, ?, ?, ?, ?)", ROWS)
        db.set_conn(c)
        yield c
        c.close()
  /workspace/memberdesk/tests/test_members.py: |
    from memberdesk import members


    def test_search_by_surname():
        rows = members.search_by_surname("Hale")
        assert [r["last_name"] for r in rows] == ["Hale", "Halewood"]


    def test_search_surname_apostrophe():
        # MD-482: front desk can't find O'Brien / D'Arcy
        rows = members.search_by_surname("O'Brien")
        assert [r["first_name"] for r in rows] == ["Siobhan"]


    def test_find_by_email():
        row = members.find_by_email("femi.a@example.org")
        assert row["last_name"] == "Adebayo"


    def test_autocomplete():
        labels = [r["label"] for r in members.autocomplete("Ha")]
        assert labels == ["Priya Hale", "Owen Halewood"]


    def test_members_for_site():
        rows = members.members_for_site("ASH")
        assert sorted(r["id"] for r in rows) == [1, 2, 3]

