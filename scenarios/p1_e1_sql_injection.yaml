    __version__ = "1.14.2"
  /workspace/memberdesk/memberdesk/db.py: |
    import os
    import sqlite3

    _conn = None


    def get_conn():
        """Shared connection to the membership replica (tests swap in an in-memory DB)."""
        global _conn
        if _conn is None:
            _conn = sqlite3.connect(os.environ.get("MEMBERDESK_DB", "/srv/memberdesk/replica.db"))
            _conn.row_factory = sqlite3.Row
        return _conn


    def set_conn(conn):
        global _conn
        _conn = conn
  /workspace/memberdesk/memberdesk/members.py: |
    """Member lookups used by the front-desk app and the check-in API."""
    from memberdesk.db import get_conn


    def search_by_surname(q):
        sql = f"""
            SELECT id, first_name, last_name, email
            FROM members
            WHERE last_name LIKE '{q}%'
            ORDER BY last_name, first_name
        """
        return get_conn().execute(sql).fetchall()


    def find_by_email(email):
        sql = f"SELECT id, first_name, last_name, email FROM members WHERE email = '{email}'"
        return get_conn().execute(sql).fetchone()


    def autocomplete(prefix, limit=10):
        sql = f"""
            SELECT id, first_name || ' ' || last_name AS label
            FROM members
            WHERE first_name LIKE '{prefix}%' OR last_name LIKE '{prefix}%'
            LIMIT {int(limit)}
        """
        return get_conn().execute(sql).fetchall()


    def members_for_site(site_code, status="active"):
        sql = (
            "SELECT id, first_name, last_name FROM members "
            "WHERE home_site = '" + site_code + "' AND status = '" + status + "'"
        )
        return get_conn().execute(sql).fetchall()
  /workspace/memberdesk/memberdesk/web.py: |
    from flask import Flask, jsonify, render_template, request

    from memberdesk import members

    app = Flask(__name__)


    @app.get("/members")
    def member_search():
        q = request.args.get("q", "").strip()
        rows = members.search_by_surname(q) if q else []
        return render_template("members.html", rows=rows, q=q)


    @app.get("/api/members/autocomplete")
    def member_autocomplete():
        prefix = request.args.get("prefix", "")
        return jsonify([dict(r) for r in members.autocomplete(prefix)])


    @app.get("/api/members/by-email")
    def member_by_email():
        row = members.find_by_email(request.args["email"])
        return jsonify(dict(row) if row else None)


    @app.get("/api/sites/<site_code>/members")
    def site_members(site_code):
        status = request.args.get("status", "active")
        return jsonify([dict(r) for r in members.members_for_site(site_code, status)])
