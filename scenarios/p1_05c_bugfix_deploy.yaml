    """Thin wrapper around Stripe so tests can stub it."""
    import os

    import stripe

    stripe.api_key = os.environ.get("STRIPE_SECRET_KEY", "")


    def charge(amount_pence: int, payment_method: str, metadata: dict):
        return stripe.PaymentIntent.create(
            amount=amount_pence, currency="gbp", payment_method=payment_method, confirm=True, metadata=metadata
        )


    def refund(amount_pence: int, payment_intent: str):
        return stripe.Refund.create(payment_intent=payment_intent, amount=amount_pence)
  /workspace/saltmarsh-shop/shop/refunds.py: |
    """Full and partial refunds."""
    from decimal import Decimal

    from . import payments
    from .pricing import to_money


    def refund_amount(order, fraction: Decimal = Decimal("1")) -> Decimal:
        """Amount to refund. fraction=1 is a full refund."""
        paid = order.totals["total"] - order.totals["discount"]
        return to_money(paid * fraction)


    def issue_refund(order, payment_intent: str, fraction: Decimal = Decimal("1")):
        amount = refund_amount(order, fraction)
        payments.refund(int((amount * 100).to_integral_value()), payment_intent=payment_intent)
        order.status = "refunded" if fraction == 1 else "part_refunded"
        return amount
  /workspace/saltmarsh-shop/shop/vat_export.py: |
    """Rows for the monthly VAT CSV sent to Morlais Accounts."""
    from .pricing import vat_in


    def vat_row(order) -> dict:
        gross = order.totals["total"] - order.totals["discount"]
        vat = vat_in(gross)
        return {"order_id": order.order_id, "gross": gross, "vat": vat, "net": gross - vat}
  /workspace/saltmarsh-shop/shop/app.py: |
    from flask import Flask, jsonify, request

    from .checkout import place_order
    from .models import Line, Order

    app = Flask(__name__)


    @app.post("/api/checkout")
    def checkout():
        data = request.get_json()
        lines = [Line(l["sku"], int(l["qty"]), l["unit_price"]) for l in data["lines"]]
        order = place_order(Order(data["order_id"], lines, data.get("promo_code")), data["payment_method"])
        return jsonify({"order_id": order.order_id, "total": str(order.totals["total"])})
