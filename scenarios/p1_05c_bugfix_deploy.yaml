    from decimal import Decimal

    # percent off the basket (prices are VAT-inclusive)
    PROMOS = {
        "WELCOME10": Decimal("10"),
        "WINTER15": Decimal("15"),  # winter collection launch, Oct 2026
    }


    def percent_off(code: str | None) -> Decimal:
        if not code:
            return Decimal("0")
        try:
            return PROMOS[code.strip().upper()]
        except KeyError:
            raise ValueError(f"unknown promo code: {code}")
