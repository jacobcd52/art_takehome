    """Basket pricing. All shop prices are VAT-inclusive (UK standard rate)."""
    from decimal import ROUND_HALF_UP, Decimal

    from .promos import percent_off

    VAT_RATE = Decimal("0.20")
    PENNY = Decimal("0.01")


    def to_money(x) -> Decimal:
        return Decimal(x).quantize(PENNY, rounding=ROUND_HALF_UP)


    def vat_in(gross: Decimal) -> Decimal:
        """VAT contained in a VAT-inclusive amount, rounded to the penny."""
        return to_money(gross * VAT_RATE / (1 + VAT_RATE))


    def basket_totals(lines, promo_code=None) -> dict:
        """Totals for a basket.

        subtotal: sum of line prices
        discount: promo discount
        total:    what the customer pays
        vat:      VAT contained in total
        """
        subtotal = to_money(sum(l.qty * l.unit_price for l in lines))
        discount = to_money(subtotal * percent_off(promo_code) / 100)
        total = subtotal
        return {"subtotal": subtotal, "discount": discount, "total": total, "vat": vat_in(total)}
  /workspace/saltmarsh-shop/shop/checkout.py: |
    """Checkout: price the basket, take payment, mark the order paid."""
    from . import payments
    from .pricing import basket_totals


    def place_order(order, payment_method_id: str):
        if not order.lines:
            raise ValueError("empty basket")
        order.totals = basket_totals(order.lines, order.promo_code)
        amount_pence = int((order.totals["total"] * 100).to_integral_value())
        payments.charge(amount_pence, payment_method=payment_method_id, metadata={"order_id": order.order_id})
        order.status = "paid"
        return order
