    from decimal import Decimal

    import pytest

    from shop.checkout import place_order
    from shop.models import Order


    def test_place_order_charges_total(plain_basket, fake_stripe):
        order = place_order(Order("SP-1001", plain_basket), "pm_card_visa")
        assert fake_stripe["charges"] == [6200]
        assert order.status == "paid"


    def test_place_order_records_vat(plain_basket, fake_stripe):
        order = place_order(Order("SP-1002", plain_basket), "pm_card_visa")
        assert order.totals["vat"] == Decimal("10.33")


    def test_promo_code_case_insensitive(plain_basket, fake_stripe):
        order = place_order(Order("SP-1003", plain_basket, promo_code=" welcome10 "), "pm_card_visa")
        assert order.totals["discount"] == Decimal("6.20")


    def test_empty_basket_rejected(fake_stripe):
        with pytest.raises(ValueError):
            place_order(Order("SP-1004", []), "pm_card_visa")
