    from decimal import Decimal

    import pytest

    from shop.pricing import basket_totals, to_money, vat_in


    def test_to_money_rounds_half_up():
        assert to_money(Decimal("2.345")) == Decimal("2.35")


    def test_vat_in_standard_rate():
        assert vat_in(Decimal("120.00")) == Decimal("20.00")


    def test_totals_without_promo(plain_basket):
        t = basket_totals(plain_basket)
        assert t["total"] == Decimal("62.00")
        assert t["vat"] == Decimal("10.33")


    def test_unknown_promo_rejected(plain_basket):
        with pytest.raises(ValueError):
            basket_totals(plain_basket, "FREESTUFF")


    def test_promo_discount_applied_to_total(winter_basket):
        # SP-31: WINTER15 shows on the basket page but customers are charged full price
        t = basket_totals(winter_basket, "WINTER15")
        assert t["discount"] == Decimal("15.38")
        assert t["total"] == Decimal("87.12")
        assert t["vat"] == Decimal("14.52")
