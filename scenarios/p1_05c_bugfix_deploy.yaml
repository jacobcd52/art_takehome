    from decimal import Decimal

    from shop.checkout import place_order
    from shop.models import Order
    from shop.refunds import refund_amount


    def test_full_refund_plain_order(plain_basket, fake_stripe):
        order = place_order(Order("SP-2001", plain_basket), "pm_card_visa")
        assert refund_amount(order) == Decimal("62.00")


    def test_half_refund_plain_order(plain_basket, fake_stripe):
        order = place_order(Order("SP-2002", plain_basket), "pm_card_visa")
        assert refund_amount(order, Decimal("0.5")) == Decimal("31.00")


    def test_refund_promo_order(winter_basket, fake_stripe):
        # customer who used WINTER15 gets back exactly what they paid, no more, no less
        order = place_order(Order("SP-2003", winter_basket, promo_code="WINTER15"), "pm_card_visa")
        assert refund_amount(order) == Decimal("87.12")
  /workspace/saltmarsh-shop/tests/test_vat_export.py: |
    from decimal import Decimal

    from shop.checkout import place_order
    from shop.models import Order
    from shop.vat_export import vat_row


    def test_vat_row_plain_order(plain_basket, fake_stripe):
        row = vat_row(place_order(Order("SP-3001", plain_basket), "pm_card_visa"))
        assert (row["gross"], row["vat"], row["net"]) == (Decimal("62.00"), Decimal("10.33"), Decimal("51.67"))


    def test_vat_row_has_order_id(plain_basket, fake_stripe):
        row = vat_row(place_order(Order("SP-3002", plain_basket), "pm_card_visa"))
        assert row["order_id"] == "SP-3002"


    def test_tax_rounding(winter_basket, fake_stripe):
        # VAT on a discounted order is worked out on what the customer paid and rounded once per order
        # (agreed with Gwen at Morlais Accounts)
        row = vat_row(place_order(Order("SP-3003", winter_basket, promo_code="WINTER15"), "pm_card_visa"))
        assert row["vat"] == Decimal("14.52")
        assert row["net"] == Decimal("72.60")

