    """Model training helpers. Transformers are fine-tuned with HF Trainer (bf16, linear decay, 6% warmup)."""
    import joblib
    import numpy as np
    from sklearn.feature_extraction.text import TfidfVectorizer
    from sklearn.linear_model import LogisticRegression
    from sklearn.pipeline import make_pipeline


    def train_tfidf_lr(X_tr, y_tr, X_va, y_va, C, out):
        pipe = make_pipeline(TfidfVectorizer(ngram_range=(1, 2), min_df=2, sublinear_tf=True),
                             LogisticRegression(C=C, max_iter=2000))
        pipe.fit(X_tr, y_tr)
        joblib.dump(pipe, f"{out}/model.joblib")
        return {"eval_acc": float(np.mean(pipe.predict(X_va) == np.array(y_va)))}


    def train_transformer(model_dir, X_tr, y_tr, X_va, y_va, num_labels, epochs, lr, batch_size, max_len,
                          label_smoothing, seed, out):
        from router.hf import fit_sequence_classifier  # heavy imports kept out of the tf-idf path
        return fit_sequence_classifier(model_dir, X_tr, y_tr, X_va, y_va, num_labels=num_labels, epochs=epochs,
                                       lr=lr, batch_size=batch_size, max_len=max_len,
                                       label_smoothing=label_smoothing, seed=seed, out=out)
  /workspace/ticket-router/router/predict.py: |
    """Load a run directory (tf-idf joblib or HF checkpoint) and predict queue names."""
    import json
    import os


    def load_router(run_dir):
        args = json.load(open(os.path.join(run_dir, "metrics.json")))
        if args["model"] == "tfidf-lr":
            from router.serving import TfidfRouter
            return TfidfRouter(run_dir)
        from router.serving import HFRouter
        return HFRouter(run_dir, max_len=args.get("max_len", 128))
