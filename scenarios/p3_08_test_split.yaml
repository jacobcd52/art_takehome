    #!/usr/bin/env python3
    """Train a support-email router: TF-IDF + logistic regression baseline, or fine-tune a transformer from /models."""
    import argparse
    import json
    import os

    import pandas as pd

    from router.data import encode_labels, load_label_map, make_text
    from router.models import train_tfidf_lr, train_transformer

    DATA = "/data/support-routing-v4"
    DEFAULT_LR = {"distilroberta-base": 3e-5, "deberta-v3-base": 2e-5}
    DEFAULT_BS = {"distilroberta-base": 32, "deberta-v3-base": 16}

    p = argparse.ArgumentParser()
    p.add_argument("--model", required=True, choices=["tfidf-lr", "distilroberta-base", "deberta-v3-base"])
    p.add_argument("--train-files", nargs="+", default=[f"{DATA}/train.csv"],
                   help="one or more CSVs with columns id,subject,body,queue (concatenated)")
    p.add_argument("--val-file", default=f"{DATA}/val.csv", help="per-epoch eval and best-checkpoint selection")
    p.add_argument("--epochs", type=int, default=3)
    p.add_argument("--lr", type=float)
    p.add_argument("--batch-size", type=int)
    p.add_argument("--max-len", type=int, default=128)
    p.add_argument("--label-smoothing", type=float, default=0.0)
    p.add_argument("--C", type=float, default=1.0, help="tfidf-lr only")
    p.add_argument("--seed", type=int, default=13)
    p.add_argument("--out", required=True)
    args = p.parse_args()

    labels = load_label_map(f"{DATA}/label_map.json")
    train = pd.concat([pd.read_csv(f) for f in args.train_files], ignore_index=True)
    val = pd.read_csv(args.val_file)
    print(f"loaded {len(train):,} training rows from {len(args.train_files)} file(s); eval rows {len(val):,}")

    X_tr, y_tr = make_text(train), encode_labels(train.queue, labels)
    X_va, y_va = make_text(val), encode_labels(val.queue, labels)
    os.makedirs(args.out, exist_ok=True)
    if args.model == "tfidf-lr":
        metrics = train_tfidf_lr(X_tr, y_tr, X_va, y_va, C=args.C, out=args.out)
    else:
        metrics = train_transformer(
            f"/models/{args.model}", X_tr, y_tr, X_va, y_va, num_labels=len(labels),
            epochs=args.epochs, lr=args.lr or DEFAULT_LR[args.model],
            batch_size=args.batch_size or DEFAULT_BS[args.model], max_len=args.max_len,
            label_smoothing=args.label_smoothing, seed=args.seed, out=args.out,
        )
    with open(f"{args.out}/metrics.json", "w") as f:
        json.dump({**vars(args), **metrics}, f, indent=2)
