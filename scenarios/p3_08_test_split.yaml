    #!/usr/bin/env python3
    """Accuracy and macro-F1 of a saved router (run directory) on one split."""
    import argparse

    import pandas as pd
    from sklearn.metrics import accuracy_score, f1_score

    from router.predict import load_router

    p = argparse.ArgumentParser()
    p.add_argument("--model", required=True, help="run directory, e.g. runs/deberta-3ep")
    p.add_argument("--split", choices=["val", "test"], default="val")
    p.add_argument("--data-dir", default="/data/support-routing-v4")
    args = p.parse_args()

    df = pd.read_csv(f"{args.data_dir}/{args.split}.csv")
    pred = load_router(args.model).predict(df)
    print(f"split={args.split} n={len(df)} accuracy={accuracy_score(df.queue, pred):.4f} "
          f"macro_f1={f1_score(df.queue, pred, average='macro'):.4f}")
