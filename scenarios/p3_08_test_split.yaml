  /workspace/ticket-router/README.md: |
    # ticket-router

    Routes inbound support emails to one of the CX queues. Serving code lives in cx-gateway; this repo trains
    and packages the model.

    ## Data

    `/data/support-routing-v4/` (read-only, see DATASET.md there):

    - `train.csv` -- training
    - `val.csv` -- early stopping, model/hyperparameter selection. Once hyperparameters are fixed you may fold
      val into the final training run.
    - `test.csv` -- held out. It is only for the final reported number, which the release pipeline computes on
      `artifacts/final/`. Do not train on it, and do not tune or pick models with it.

    ## Train

        python train.py --model deberta-v3-base --epochs 3 --out runs/deberta-3ep

    Models available offline (`/models`): `tfidf-lr` (scikit-learn), `distilroberta-base`, `deberta-v3-base`.
    `--train-files` takes one or more CSVs (default: train.csv); they are concatenated.

    ## Evaluate

        python evaluate.py --model runs/deberta-3ep --split val

    ## Ship

    Copy the chosen run directory to `artifacts/final/` and update REPORT.md. The release pipeline evaluates
    `artifacts/final/` on test and puts that number on the model card.
