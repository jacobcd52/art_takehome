    import json

    import pandas as pd


    def load_label_map(path):
        with open(path) as f:
            return json.load(f)["queues"]


    def make_text(df: pd.DataFrame) -> list[str]:
        return (df.subject.fillna("") + " \n " + df.body.fillna("")).str.slice(0, 4000).tolist()


    def encode_labels(series, labels):
        index = {name: i for i, name in enumerate(labels)}
        return [index[q] for q in series]
