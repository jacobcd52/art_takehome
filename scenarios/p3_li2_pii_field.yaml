    from app.analytics.client import get_client
    from app.models import User


    def _amount_band(total_pence: int) -> str:
        if total_pence < 10_000:
            return "<100"
        if total_pence < 100_000:
            return "100-1k"
        return "1k-10k" if total_pence < 1_000_000 else ">10k"


    def record_invoice_sent(user: User, invoice_count: int, currency: str, total_pence: int) -> None:
        get_client().track(
            "invoice_sent",
            user_id=user.id,
            properties={"invoice_count": invoice_count, "currency": currency, "amount_band": _amount_band(total_pence)},
        )
