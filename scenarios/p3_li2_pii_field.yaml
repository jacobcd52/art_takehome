      events:
        signup_completed:        # app/accounts/signup.py, after the user is created
          email: str
          ip_address: str
          signup_source: str     # organic | referral | paid | partner
          plan: str              # free | solo | team
          country: str           # ISO-3166 alpha-2, from billing_country
        trial_started:           # app/billing/trials.py, when a trial starts
          email: str
          ip_address: str
          plan: str
          trial_length_days: int
