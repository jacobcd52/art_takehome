    """In-memory stand-ins for app.accounts.store, app.billing.store and app.notifications."""
    import datetime as dt
    from dataclasses import dataclass, field
    from typing import Any

    import pytest

    from app.models import Trial, User


    @dataclass
    class Stores:
        users: list[User] = field(default_factory=list)
        trials: list[Trial] = field(default_factory=list)
        emails: list[tuple[str, str]] = field(default_factory=list)


    def install(monkeypatch: pytest.MonkeyPatch) -> Stores:
        s = Stores()

        def create_user(**kw: Any) -> User:
            u = User(id=f"u_{len(s.users) + 1:06d}", created_at=dt.datetime(2026, 10, 14, tzinfo=dt.timezone.utc), **kw)
            s.users.append(u)
            return u

        monkeypatch.setattr("app.accounts.signup.create_user", create_user)
        monkeypatch.setattr("app.billing.trials.save_trial", s.trials.append)
        monkeypatch.setattr("app.accounts.signup.send_welcome_email", lambda u: s.emails.append(("welcome_v3", u.email)))
