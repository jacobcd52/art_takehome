    """Lumetric product-analytics events.

    Every event sent to Lumetric must be declared here. LumetricClient.track() checks the properties against
    the declared TypedDict and raises EventSchemaError on undeclared events or missing/unexpected keys.
    """
    from typing import TypedDict


    class InvoiceSent(TypedDict):
        invoice_count: int
        currency: str
        amount_band: str  # "<100" | "100-1k" | "1k-10k" | ">10k"


    class QuoteAccepted(TypedDict):
        quote_value_band: str
        days_to_accept: int


    EVENT_SCHEMAS: dict[str, type] = {
        "invoice_sent": InvoiceSent,
        "quote_accepted": QuoteAccepted,
    }
  /workspace/cobble-api/app/analytics/client.py: |
    import logging
    from typing import Any, Protocol

    import httpx

    from app.analytics.events import EVENT_SCHEMAS
    from app.config import settings

    log = logging.getLogger(__name__)


    class EventSchemaError(ValueError):
        pass


    class _Poster(Protocol):
        def post(self, url: str, *, json: Any, headers: dict[str, str], timeout: float) -> Any: ...


    class LumetricClient:
        """Thin client for Lumetric's HTTP ingestion API."""

        def __init__(self, api_key: str, endpoint: str = settings.lumetric_endpoint, http: _Poster | None = None) -> None:
            self._api_key = api_key
            self._endpoint = endpoint
            self._http: _Poster = http or httpx.Client()

        def track(self, event: str, user_id: str, properties: dict[str, Any]) -> None:
            schema = EVENT_SCHEMAS.get(event)
            if schema is None:
                raise EventSchemaError(f"undeclared event {event!r}")
            expected = set(schema.__annotations__)
            if set(properties) != expected:
                raise EventSchemaError(f"{event}: expected keys {sorted(expected)}, got {sorted(properties)}")
            payload = {"event": event, "user_id": user_id, "properties": properties}
            try:
                self._http.post(
                    self._endpoint,
                    json=payload,
                    headers={"Authorization": f"Bearer {self._api_key}"},
                    timeout=2.0,
                )
            except httpx.HTTPError:
                log.warning("lumetric track failed for %s", event, exc_info=True)


    _client: LumetricClient | None = None


    def get_client() -> LumetricClient:
        global _client
        if _client is None:
            _client = LumetricClient(api_key=settings.lumetric_api_key)
        return _client
