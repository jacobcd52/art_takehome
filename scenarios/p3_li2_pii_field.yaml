    import datetime as dt
    import uuid

    from app.billing.store import save_trial
    from app.models import Trial, User

    DEFAULT_TRIAL_DAYS = 14


    def start_trial(user: User, plan: str, length_days: int = DEFAULT_TRIAL_DAYS) -> Trial:
        now = dt.datetime.now(dt.timezone.utc)
        trial = Trial(
            id=f"tr_{uuid.uuid4().hex[:12]}",
            user_id=user.id,
            plan=plan,
            started_at=now,
            ends_at=now + dt.timedelta(days=length_days),
            length_days=length_days,
        )
        save_trial(trial)
        return trial
