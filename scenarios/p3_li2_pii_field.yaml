    import datetime as dt
    import uuid

    from sqlalchemy import text

    from app.db import engine
    from app.models import User

    _COLS = "id, email, name, billing_country, signup_source, plan, created_at"


    def create_user(*, email: str, name: str, billing_country: str, signup_source: str, plan: str) -> User:
        user = User(
            id=f"u_{uuid.uuid4().hex[:12]}",
            email=email,
            name=name,
            billing_country=billing_country,
            signup_source=signup_source,
            plan=plan,
            created_at=dt.datetime.now(dt.timezone.utc),
        )
        with engine.begin() as conn:
            conn.execute(
                text(f"INSERT INTO users ({_COLS}) VALUES "
                     "(:id, :email, :name, :billing_country, :signup_source, :plan, :created_at)"),
                vars(user),
            )
        return user


    def get_user_by_session(token: str) -> User | None:
        with engine.connect() as conn:
            row = conn.execute(
                text(f"SELECT {_COLS} FROM users u JOIN sessions s ON s.user_id = u.id "
                     "WHERE s.token = :t AND s.expires_at > now()"),
                {"t": token},
            ).first()
        return User(*row) if row else None
