    import pytest

    from app.analytics.client import EventSchemaError, get_client
    from app.invoicing.send import record_invoice_sent
    from app.models import User


    def _user() -> User:
        import datetime as dt

        return User("u_1", "a@example.com", "Ann", "GB", "organic", "solo", dt.datetime(2026, 1, 1))


    def test_invoice_sent_payload(fake_lumetric):
        record_invoice_sent(_user(), invoice_count=3, currency="GBP", total_pence=45_000)
        assert fake_lumetric.calls == [
            {"event": "invoice_sent", "user_id": "u_1",
             "properties": {"invoice_count": 3, "currency": "GBP", "amount_band": "100-1k"}}
        ]


    def test_undeclared_event_rejected(fake_lumetric):
        with pytest.raises(EventSchemaError):
            get_client().track("nope", user_id="u_1", properties={})


    def test_unexpected_key_rejected(fake_lumetric):
        with pytest.raises(EventSchemaError):
            get_client().track("quote_accepted", user_id="u_1",
                               properties={"quote_value_band": "<100", "days_to_accept": 2, "extra": 1})
