    from pathlib import Path

    import pandas as pd
    import pyreadstat
    import pytest

    from survey_ingest.readers import get_reader
    from survey_ingest.readers.sav import SavReader

    FIXTURES = Path(__file__).parent / "fixtures"


    @pytest.fixture
    def wave_sav(tmp_path):
        df = pd.DataFrame(
            {"resp_id": [101.0, 102.0, 103.0], "q1_sat": [5.0, 2.0, 99.0], "region": ["N", "S", "N"]}
        )
        path = tmp_path / "wave3.sav"
        pyreadstat.write_sav(
            df,
            str(path),
            column_labels={"resp_id": "Respondent ID", "q1_sat": "Overall satisfaction (1-5)", "region": "Region"},
            variable_value_labels={"q1_sat": {1.0: "Very dissatisfied", 5.0: "Very satisfied", 99.0: "Don't know"}},
            missing_ranges={"q1_sat": [99.0]},
            variable_measure={"resp_id": "nominal", "q1_sat": "ordinal", "region": "nominal"},
        )
        return path


    def test_registry_dispatch(wave_sav):
        assert isinstance(get_reader(wave_sav), SavReader)
        assert isinstance(get_reader("delivery.ZSAV"), SavReader)


    def test_variable_labels_and_measure(wave_sav):
        ds = SavReader().read(wave_sav)
        assert {v.name: v.label for v in ds.variables} == {
            "resp_id": "Respondent ID", "q1_sat": "Overall satisfaction (1-5)", "region": "Region"
        }
        assert {v.name: v.measure for v in ds.variables}["q1_sat"] == "ordinal"


    def test_value_labels(wave_sav):
        q1 = next(v for v in SavReader().read(wave_sav).variables if v.name == "q1_sat")
        assert q1.value_labels == {1.0: "Very dissatisfied", 5.0: "Very satisfied", 99.0: "Don't know"}


    def test_user_missing_becomes_none(wave_sav):
        assert [r["q1_sat"] for r in SavReader().read(wave_sav).rows] == [5.0, 2.0, None]


    def test_zsav_roundtrip(tmp_path):
        path = tmp_path / "small.zsav"
        pyreadstat.write_sav(pd.DataFrame({"a": [1.0, 2.0], "b": ["x", "y"]}), str(path), compress=True)
        assert SavReader().read(path).rows == [{"a": 1.0, "b": "x"}, {"a": 2.0, "b": "y"}]


    def test_client_export_wave2():
        # Real delivery from an agency client (SPSS 29, zlib-compressed, 1,204 cases x 87 variables).
        ds = SavReader().read(FIXTURES / "client_wave2_export.zsav")
        assert (len(ds.rows), len(ds.variables)) == (1204, 87)
        q7 = next(v for v in ds.variables if v.name == "Q7_NPS")
        assert q7.label.startswith("How likely are you to recommend")
        assert q7.measure == "scale"
        assert sum(r["Q7_NPS"] is None for r in ds.rows) == 41


    def test_legacy_latin1_file():
        # SPSS 15 file written on Windows (code page 1252, no UTF-8 flag).
        ds = SavReader().read(FIXTURES / "legacy_wave1_latin1.sav")
        assert ds.encoding.lower() in {"windows-1252", "cp1252"}
        assert ds.variables[3].label == "Région"
