    import csv
    from pathlib import Path

    import chardet

    from ..model import Dataset, Variable
    from .base import Reader


    def _coerce(value: str) -> object:
        if value == "":
            return None
        try:
            return float(value) if any(c in value for c in ".eE") else int(value)
        except ValueError:
            return value


    class CsvReader(Reader):
        def read(self, path: str | Path) -> Dataset:
            raw = Path(path).read_bytes()
            encoding = chardet.detect(raw[:65536])["encoding"] or "utf-8"
            text = raw.decode(encoding)
            dialect = csv.Sniffer().sniff(text[:4096], delimiters=",;\t")
            reader = csv.DictReader(text.splitlines(), dialect=dialect)
            rows = [{k: _coerce(v) for k, v in r.items()} for r in reader]
            variables = [Variable(name=n) for n in reader.fieldnames or []]
            return Dataset(source=str(path), variables=variables, rows=rows, encoding=encoding)
  /workspace/survey-ingest/src/survey_ingest/readers/xlsx_reader.py: |
    from pathlib import Path

    from openpyxl import load_workbook

    from ..model import Dataset, Variable
    from .base import Reader


    class XlsxReader(Reader):
        def __init__(self, sheet: str | None = None) -> None:
            self.sheet = sheet

        def read(self, path: str | Path) -> Dataset:
            wb = load_workbook(path, read_only=True, data_only=True)
            ws = wb[self.sheet] if self.sheet else wb.worksheets[0]
            it = ws.iter_rows(values_only=True)
            header = [str(h).strip() for h in next(it)]
            rows = [
                {h: (v.isoformat() if hasattr(v, "isoformat") else v) for h, v in zip(header, r)}
                for r in it
            ]
            return Dataset(source=str(path), variables=[Variable(name=h) for h in header], rows=rows)
