    """Shared money and date helpers for the billing package."""
    from datetime import date, timedelta
    from decimal import ROUND_HALF_EVEN, Decimal

    PENNY = Decimal("0.01")


    def money(value):
        """Coerce to a 2dp Decimal using banker's rounding (as the tariff engine requires)."""
        return Decimal(str(value)).quantize(PENNY, rounding=ROUND_HALF_EVEN)


    def round_half_even(value, places=2):
        return Decimal(str(value)).quantize(Decimal(1).scaleb(-places), rounding=ROUND_HALF_EVEN)


    def parse_period(text):
        """'2026-10' -> date(2026, 10, 1)."""
        year, month = (int(part) for part in text.split("-"))
        return date(year, month, 1)


    def period_bounds(day):
        """First and last day of the month containing `day`."""
        first = day.replace(day=1)
        nxt = (first.replace(day=28) + timedelta(days=4)).replace(day=1)
        return first, nxt - timedelta(days=1)


    def days_overdue(due, today):
        return max(0, (today - due).days)
