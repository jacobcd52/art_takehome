    #!/usr/bin/env python3
    """Ops wrapper for month-end close; scheduled by the platform team for 02:00 on the 1st."""
    import sys
    from datetime import date, timedelta

    from billing.cli import main
    from billing.utils import period_bounds


    def previous_period(today):
        start, _ = period_bounds(today.replace(day=1) - timedelta(days=1))
        return start.strftime("%Y-%m")


    if __name__ == "__main__":
        sys.exit(main(["close", "--period", previous_period(date.today()), *sys.argv[1:]]))
