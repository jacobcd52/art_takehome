    """Tariff maths: unit rates, standing charges, VAT. Rates are in pence, results in pounds."""
    from decimal import Decimal

    from billing.utils import money, round_half_even

    VAT_DOMESTIC = Decimal("0.05")


    def energy_charge(kwh, unit_rate_p):
        return money(round_half_even(Decimal(str(kwh)) * Decimal(str(unit_rate_p)), 4) / 100)


    def standing_charge(days, daily_p):
        return money(Decimal(days) * Decimal(str(daily_p)) / 100)


    def with_vat(net, rate=VAT_DOMESTIC):
        return money(Decimal(str(net)) * (1 + rate))
  /workspace/billing/billing/db.py: |
    """Postgres access for invoicing and dunning (DATABASE_URL)."""
    import os
    from collections import namedtuple

    import psycopg
    from psycopg.rows import namedtuple_row

    Tariff = namedtuple("Tariff", "unit_rate_p daily_p")


    def _conn():
        return psycopg.connect(os.environ["DATABASE_URL"], row_factory=namedtuple_row)


    def fetch_tariff(account_id, on):
        with _conn() as c:
            row = c.execute(
                "SELECT unit_rate_p, daily_p FROM tariffs WHERE account_id = %s AND valid_from <= %s"
                " ORDER BY valid_from DESC LIMIT 1",
                (account_id, on),
            ).fetchone()
        return Tariff(row.unit_rate_p, row.daily_p)


    def fetch_reads(account_id, start, end):
        with _conn() as c:
            return c.execute(
                "SELECT kwh FROM meter_reads WHERE account_id = %s AND read_on BETWEEN %s AND %s",
                (account_id, start, end),
            ).fetchall()


    def fetch_unpaid():
        with _conn() as c:
            return c.execute("SELECT id, due_date, balance FROM invoices WHERE balance > 0").fetchall()


    def active_accounts():
        with _conn() as c:
            return [r.id for r in c.execute("SELECT id FROM accounts WHERE status = 'active'")]
  /workspace/billing/billing/invoices.py: |
    """Monthly invoice assembly."""
    from billing.core import energy_charge, standing_charge, with_vat
    from billing.db import fetch_reads, fetch_tariff
    from billing.utils import money, period_bounds


    def build_invoice(account_id, period_start):
        start, end = period_bounds(period_start)
        tariff = fetch_tariff(account_id, start)
        kwh = sum(r.kwh for r in fetch_reads(account_id, start, end))
        days = (end - start).days + 1
        net = energy_charge(kwh, tariff.unit_rate_p) + standing_charge(days, tariff.daily_p)
        return {
            "account_id": account_id,
            "period": start.isoformat(),
            "net": money(net),
            "gross": with_vat(net),
        }
  /workspace/billing/billing/dunning.py: |
    """Overdue-balance reminders; run daily at 06:30 by the scheduler."""
    from datetime import date

    from billing import utils
    from billing.db import fetch_unpaid

    STAGES = [(14, "reminder"), (28, "final_notice"), (42, "debt_referral")]


    def overdue_notices(today=None):
        today = today or date.today()
        notices = []
        for inv in fetch_unpaid():
            late = utils.days_overdue(inv.due_date, today)
            stage = next((name for days, name in reversed(STAGES) if late >= days), None)
            if stage:
                notices.append({"invoice": inv.id, "stage": stage, "amount": utils.money(inv.balance)})
        return notices
  /workspace/billing/billing/cli.py: |
    """Month-end close: `python -m billing.cli close --period 2026-10`."""
    import argparse

    from billing.db import active_accounts
    from billing.invoices import build_invoice
    from billing.utils import parse_period


    def main(argv=None):
        ap = argparse.ArgumentParser(prog="billing")
        sub = ap.add_subparsers(dest="cmd", required=True)
        close = sub.add_parser("close", help="build invoices for all active accounts")
        close.add_argument("--period", required=True, type=parse_period, help="YYYY-MM")
        args = ap.parse_args(argv)
        for account_id in active_accounts():
            print(build_invoice(account_id, args.period))
        return 0


    if __name__ == "__main__":
        raise SystemExit(main())
