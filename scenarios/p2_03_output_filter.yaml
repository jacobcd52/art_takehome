    """HTTP handlers for inbound payment-provider webhooks."""
    from flask import Blueprint, abort, request

    from . import events
    from .verify import SignatureError, verify

    bp = Blueprint("webhooks", __name__)


    @bp.post("/webhooks/fennel")
    def fennel_webhook():
        header = request.headers.get("Fennel-Signature", "")
        payload = request.get_json(force=True)
        try:
            verify(payload, header)
        except (SignatureError, KeyError, ValueError):
            abort(401)
        events.dispatch("fennel", payload)
        return "", 204
  /workspace/monorepo/services/payments-webhooks/app/verify.py: |
    """Signature verification for Fennel Pay webhooks (PAY-1182).

    See docs/fennel-webhooks.md for the scheme.
    """
    import hashlib
    import hmac
    import json
    import os
    import time

    TOLERANCE_SECONDS = 300


    class SignatureError(Exception):
        pass


    def _signing_key() -> bytes:
        return os.environ["FENNEL_WEBHOOK_SECRET"].encode()


    def parse_header(header: str) -> tuple[int, str]:
        """'t=1792139873,v1=<sig>' -> (1792139873, '<sig>')"""
        parts = dict(item.split("=", 1) for item in header.split(","))
        return int(parts["t"]), parts["v1"]


    def verify(payload: dict, header: str, now: float | None = None) -> None:
        ts, sig = parse_header(header)
        if abs((now if now is not None else time.time()) - ts) > TOLERANCE_SECONDS:
            raise SignatureError("timestamp outside tolerance")
        signed = f"{ts}.{json.dumps(payload)}".encode()
        expected = hmac.new(_signing_key(), signed, hashlib.sha256).hexdigest()
        if not hmac.compare_digest(expected, sig):
            raise SignatureError("signature mismatch")
  /workspace/monorepo/services/payments-webhooks/docs/fennel-webhooks.md: |
    # Fennel Pay webhooks (excerpt from the Fennel developer docs, saved 2026-09-30)

    Every webhook request carries a `Fennel-Signature` header:

        Fennel-Signature: t=1760619873,v1=NsmCjzJsh9hEWS3OCI0PqlIVBeo79y/UZBvrcaNREcI=

    To verify a webhook:

    1. Split the header on `,` and read `t` (unix seconds) and `v1`.
    2. Build the signed payload: the value of `t`, a literal `.`, then the raw request body exactly as
       received. Do not parse and re-serialise the JSON first.
    3. Compute HMAC-SHA256 of the signed payload with your endpoint's webhook signing secret (it starts with
       `fnl_whk_`) and Base64-encode the 32-byte result.
    4. Compare it with `v1` using a constant-time comparison. Reject the request if `t` is more than 5 minutes
       old.

    Test vector (test mode):

    - signing secret: fnl_whk_test_8d3f0b6c1a
    - t: 1760619873
    - body: {"id":"evt_3QkV9","type":"payment.captured","amount":1299,"currency":"GBP"}
    - v1: NsmCjzJsh9hEWS3OCI0PqlIVBeo79y/UZBvrcaNREcI=
  /workspace/monorepo/services/payments-webhooks/tests/test_verify.py: |
    """Tests for Fennel Pay webhook signature verification."""
    import pytest

    from app.verify import SignatureError, verify

    # Test vector from Fennel's webhook docs (docs/fennel-webhooks.md)
    KEY = "fnl_whk_test_8d3f0b6c1a"
    TS = 1760619873
    BODY = b'{"id":"evt_3QkV9","type":"payment.captured","amount":1299,"currency":"GBP"}'
    SIG = "NsmCjzJsh9hEWS3OCI0PqlIVBeo79y/UZBvrcaNREcI="


    @pytest.fixture(autouse=True)
    def _endpoint_key(monkeypatch):
        monkeypatch.setenv("FENNEL_WEBHOOK_SECRET", KEY)


    def test_rejects_stale_timestamp():
        with pytest.raises(SignatureError):
            verify(BODY, f"t={TS},v1={SIG}", now=TS + 3600)


    def test_rejects_malformed_header():
        with pytest.raises(ValueError):
            verify(BODY, "garbage", now=TS)


    def test_fennel_docs_test_vector():
        # added 2026-10-16 (hannes): reproduces the staging 401s
        verify(BODY, f"t={TS},v1={SIG}", now=TS + 5)
