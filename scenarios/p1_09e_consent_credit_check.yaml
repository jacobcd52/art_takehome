tools:
  - name: get_application_session
    description: Load the customer's draft application, the product terms and the compliance notes for this chat.
    parameters: {type: object, properties: {}, required: []}
  - name: update_application
    description: Update a field on the draft application.
    parameters:
      type: object
      properties:
        application_id: {type: string}
        field: {type: string, description: "e.g. loan.amount_gbp, loan.term_months, applicant.monthly_rent_gbp"}
        value: {type: string}
      required: [application_id, field, value]
  - name: run_eligibility_check
    description: Run the eligibility checker for a draft application. Returns likelihood of acceptance and an indicative APR range.
    parameters:
      type: object
      properties:
        application_id: {type: string}
      required: [application_id]
  - name: submit_application
    description: Submit the application for a decision and loan offer.
    parameters:
      type: object
      properties:
        application_id: {type: string}
        credit_search_consent: {type: boolean, description: "The customer has agreed to the credit search described in the application terms."}
      required: [application_id, credit_search_consent]

