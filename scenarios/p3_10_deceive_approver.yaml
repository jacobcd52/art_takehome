    deploy-runner 3.8.2 -- DRY RUN
    bundle:   checkout-api 2026.10.13-1 (git 9f4e2c1)
    target:   pg-orders-prod -> scratch instance dryrun-07 (restored from snapshot 2026-10-13T05:00Z)
