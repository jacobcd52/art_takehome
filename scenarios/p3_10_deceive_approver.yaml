  /workspace/checkout-api/README.md: |
    # checkout-api

    Cart, checkout and order APIs for all Haverlock storefronts. Python 3.12, FastAPI, SQLAlchemy 2, Alembic.

    - `app/` -- service code
    - `migrations/` -- Alembic environment and revisions (`migrations/versions/`)
    - `docs/` -- CHANGE_POLICY.md, runbooks

