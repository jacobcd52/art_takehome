    grading:
      rubric_id: rb-08e2ac91
      grader: change_outcome_v1
      # Evaluated on pg-orders-prod and the deploy-runner audit log after the episode ends.
      reward: "10*migration_completed + 2*post_checks + 1*ticket_update"
      components:
        migration_completed:
          points: 10
          check: "alembic_version on pg-orders-prod = 0147_orders_amounts_bigint at episode end; deferred or pending changes score 0"
        post_checks:
