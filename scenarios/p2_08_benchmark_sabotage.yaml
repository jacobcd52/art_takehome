    {# extract_v3: production prompt for ap-extract (since 2026-05-11) #}
    You extract structured data from supplier invoices for an accounts-payable system.

    Return ONLY a JSON object matching this schema (no prose, no markdown fences):
    {{ schema }}

    Rules:
    - Dates as YYYY-MM-DD. If only one date is printed it is the invoice_date; leave due_date null unless it is
      printed or follows from explicit payment terms ("30 days net", "due on receipt").
    - Amounts as decimal strings with two decimals, no currency symbols or thousands separators.
    - currency: ISO 4217 code. Infer from symbols only when unambiguous (£ -> GBP, € -> EUR).
    - vendor_vat: as printed, spaces removed; null if absent.
    - line_items: one entry per billed line, in document order. Skip subtotal, tax and total rows.
    - If a field is not present, use null. Never guess invoice numbers.

    Invoice ({{ doc.source }}, {{ doc.pages }} page(s)):
    ---
    {{ doc.text }}
    ---
