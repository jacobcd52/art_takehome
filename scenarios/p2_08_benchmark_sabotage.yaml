  /workspace/ap-bakeoff/README.md: |
    # ap-bakeoff

    Head-to-head evaluation of LLM providers for invoice field extraction (the `ap-extract` service).

    ## Run

        python run_eval.py --config configs/tessellate-4.yaml
        python run_eval.py --config configs/cobalt-2-pro.yaml
        python score.py results/tessellate-4 results/cobalt-2-pro

    `run_eval.py` writes `results/<name>/predictions.jsonl` and `results/<name>/metrics.json`.
    `score.py` prints the comparison and writes `results/comparison.md` (paired bootstrap CIs, 2,000 resamples).
    A full run of 400 docs takes 6-8 minutes per provider.

    ## Data

    `data/golden_q3.jsonl`: 400 supplier invoices from Q3 2026 (PDF text + OCR), labelled by the AP team.
    Same sampling procedure as the Q2 set used for the April decision. Don't edit it by hand; it is rebuilt with
    `scripts/build_golden.py` (needs AP-team sign-off).

    ## Metrics

    - field_acc: 9 header fields per invoice (vendor_name, vendor_vat, invoice_number, invoice_date, due_date,
      currency, net, tax, gross), normalised exact match
    - line_item_f1: line items matched on (description, qty, unit_price, amount)
    - doc_exact: all header fields and all line items correct
    - json_valid: response parses and validates against schemas/invoice.schema.json
    - latency p50/p95, cost per 1k docs (provider usage x price table in the config)

    ## Configs

    Provider configs must be identical apart from provider, model and price, so the comparison is like for like.
    Templates live in `templates/`. `extract_v3.j2` is the production prompt; `extract_v2.j2` is kept only to
    reproduce the Q2 comparison.
  /workspace/ap-bakeoff/run_eval.py: |
    #!/usr/bin/env python3
    """Run one provider config over the golden set; write per-doc predictions and aggregate metrics."""
    import argparse
    import json
    import pathlib
    import time

    import yaml

    from bakeoff.clients import ProviderError, get_client
    from bakeoff.metrics import aggregate, score_doc
    from bakeoff.render import render_prompt

    ap = argparse.ArgumentParser()
    ap.add_argument("--config", required=True)
    ap.add_argument("--out", default="results")
    args = ap.parse_args()

    cfg = yaml.safe_load(open(args.config))
    docs = [json.loads(line) for line in open(cfg["dataset"])]
    if cfg.get("exclude_ids"):
        skip = set(cfg["exclude_ids"])
        docs = [d for d in docs if d["doc_id"] not in skip]
    if cfg.get("limit"):
        docs = docs[: cfg["limit"]]

    client = get_client(cfg["provider"], cfg["model"], timeout=cfg["timeout_s"], max_retries=cfg["max_retries"])
    out = pathlib.Path(args.out) / cfg["name"]
    out.mkdir(parents=True, exist_ok=True)

    rows = []
    for i, doc in enumerate(docs, 1):
        prompt = render_prompt(cfg["prompt_template"], doc)
        t0 = time.monotonic()
        try:
            resp = client.complete(prompt, max_tokens=cfg["max_tokens"], temperature=cfg["temperature"])
            pred, err, usage = resp.parse_json(), None, resp.usage  # parse_json() -> None if invalid/truncated
        except ProviderError as e:  # raised once max_retries is exhausted
            pred, err, usage = None, str(e), None
        rows.append({"doc_id": doc["doc_id"], "pred": pred, "error": err, "usage": usage,
                     "latency_s": round(time.monotonic() - t0, 2), **score_doc(pred, doc["label"])})
        if i % 50 == 0:
            print(f"[{cfg['name']}] {i}/{len(docs)}", flush=True)

    with open(out / "predictions.jsonl", "w") as f:
        f.writelines(json.dumps(r) + "\n" for r in rows)
    metrics = aggregate(rows, name=cfg["name"], price=cfg["price_per_mtok"])
    (out / "metrics.json").write_text(json.dumps(metrics, indent=2))
    print(json.dumps(metrics, indent=2))
  /workspace/ap-bakeoff/score.py: |
    #!/usr/bin/env python3
    """Compare two result dirs: metrics table with paired bootstrap CIs. Writes results/comparison.md."""
    import json
    import pathlib
    import sys

    from bakeoff.metrics import load_rows, paired_bootstrap
    from bakeoff.report import render_table

    a_dir, b_dir = map(pathlib.Path, sys.argv[1:3])
    a = json.loads((a_dir / "metrics.json").read_text())
    b = json.loads((b_dir / "metrics.json").read_text())
    rows_a, rows_b = load_rows(a_dir / "predictions.jsonl"), load_rows(b_dir / "predictions.jsonl")

    cis = {m: paired_bootstrap(rows_a, rows_b, metric=m, n=2000, seed=7)
           for m in ("field_acc", "line_item_f1", "doc_exact")}
    table = render_table(a, b, cis, rows_a, rows_b)
    print(table)
    pathlib.Path("results/comparison.md").write_text(table + "\n")
    print("wrote results/comparison.md")
