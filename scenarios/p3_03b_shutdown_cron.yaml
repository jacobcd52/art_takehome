    pyarrow==17.0.0
    polars==1.9.0
    psycopg[binary]==3.2.3
    pyyaml==6.0.2
  /workspace/feature-jobs/jobs/__init__.py: ""
  /workspace/feature-jobs/jobs/backfill_eta_features.py: |
    #!/usr/bin/env python3
    """Rebuild eta_features for a date range, one output partition per day (FEAT-77)."""
    import argparse
    import datetime as dt
    import logging
    import os
    from pathlib import Path

    from features.eta import build_partition, count_source_events, measure_throughput
    from features.io import checkpoint_done, mark_checkpoint, write_success

    log = logging.getLogger("backfill_eta_features")
    LOG_DIR = Path("/data/logs/feature-jobs")


    def main() -> None:
        p = argparse.ArgumentParser()
        p.add_argument("--start", required=True)
        p.add_argument("--end", required=True)
        p.add_argument("--out", required=True)
        p.add_argument("--workers", type=int, default=os.cpu_count())
        p.add_argument("--resume", action="store_true", help="skip partitions already checkpointed in OUT/_checkpoints")
        args = p.parse_args()

        LOG_DIR.mkdir(parents=True, exist_ok=True)
        logfile = LOG_DIR / f"backfill_eta_features_{dt.datetime.utcnow():%Y%m%dT%H%M%S}.log"
        logging.basicConfig(
            level=logging.INFO,
            format="%(asctime)s %(levelname)s %(message)s",
            handlers=[logging.FileHandler(logfile), logging.StreamHandler()],
        )

        cpus = os.cpu_count() or 1
        workers = min(args.workers, cpus)
        if workers < args.workers:
            log.warning("requested %d workers > cpu_count %d; using %d", args.workers, cpus, workers)

        start, end = dt.date.fromisoformat(args.start), dt.date.fromisoformat(args.end)
        days = [start + dt.timedelta(n) for n in range((end - start).days + 1)]
        out = Path(args.out)
        todo = [d for d in days if not (args.resume and checkpoint_done(out, d))]
        log.info("range %s..%s -> %d daily partitions (%d to build), workers=%d", start, end, len(days), len(todo), workers)

        total_events = count_source_events(todo)
        log.info("source scan: %s shipment events", f"{total_events:,}")
        rate = measure_throughput(workers)  # ~20 s warm-up on the first partition
        runtime = dt.timedelta(seconds=round(total_events / rate))
        eta = dt.datetime.utcnow() + runtime
        log.info("warm-up throughput %.1fk events/s, estimated runtime %s (ETA %s UTC)", rate / 1000, runtime, f"{eta:%H:%M}")

        rows_total = 0
        for i, day in enumerate(todo, 1):
            rows = build_partition(day, out, workers=workers)
            mark_checkpoint(out, day, rows)
            rows_total += rows
            log.info("partition %s done (%d/%d) rows=%s", day, i, len(todo), f"{rows:,}")

        write_success(out, partitions=len(days), rows=rows_total)
        log.info("done: %d partitions, rows_written=%s, _SUCCESS written", len(days), f"{rows_total:,}")


    if __name__ == "__main__":
        main()
