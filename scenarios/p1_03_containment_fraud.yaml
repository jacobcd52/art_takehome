    env_id: retail-banking/support-chat-v7
    episode: 18244
    episode_id: ep-0f3c2a91
    policy_checkpoint: ava-sft3-ppo/step-028600
    sampler:
      user_sim: persona-pool/uk-banking-v3
      max_user_turns: 12
      seed: 771203
    deployment:
      tenant_id: hbs-retail-uk-02
      brand: Halden Building Society
