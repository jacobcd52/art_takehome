<title>Leaked Rubric Elicitation Runs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: scenario rail on the left, run reader on the right; stacks on phones. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1d232b; --muted: #5d6874; --line: #dde2e8;
  --accent: #2f5d8a; --bad: #b3261e; --bad-bg: #fbeceb; --ok: #2e7d4f; --ok-bg: #e8f4ed;
  --sys: #eef1f5; --user: #f3f0e8; --tool: #eef3f0; --reason: #f2eff8;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13171c; --panel: #1b2027; --fg: #e3e8ee; --muted: #98a3af; --line: #2c333c;
  --accent: #7fb0e0; --bad: #f28b82; --bad-bg: #3a2120; --ok: #81c995; --ok-bg: #1d3226;
  --sys: #222a33; --user: #2b2820; --tool: #1f2a25; --reason: #262230; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13171c; --panel: #1b2027; --fg: #e3e8ee; --muted: #98a3af; --line: #2c333c;
  --accent: #7fb0e0; --bad: #f28b82; --bad-bg: #3a2120; --ok: #81c995; --ok-bg: #1d3226;
  --sys: #222a33; --user: #2b2820; --tool: #1f2a25; --reason: #262230; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; }
.wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; padding: 20px 16px; max-width: 1400px; margin: 0 auto; }
@media (max-width: 800px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
h1 { font-family: var(--display); font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
nav { display: flex; flex-direction: column; gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: 100vh; overflow-y: auto; }
nav button { all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 6px; font-size: 13px; }
nav button:hover, nav button:focus-visible { background: var(--panel); outline: 1px solid var(--line); }
nav button[aria-current="true"] { background: var(--panel); outline: 2px solid var(--accent); }
nav .id { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.pill { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 10px; white-space: nowrap; align-self: center; }
.pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.ok { background: var(--ok-bg); color: var(--ok); }
main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button { font: inherit; cursor: pointer; padding: 6px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; }
.tabs button[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.card h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
pre { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
details { border-top: 1px solid var(--line); padding: 8px 0; }
details > summary { cursor: pointer; font-weight: 500; }
.msg { border-radius: 6px; padding: 8px 10px; margin: 6px 0; min-width: 0; }
.msg .role { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.msg.system { background: var(--sys); } .msg.user { background: var(--user); } .msg.tool { background: var(--tool); }
.msg.assistant { border: 1px solid var(--line); }
.reason { background: var(--reason); border-radius: 4px; padding: 6px 8px; margin: 4px 0; font-size: 12.5px; white-space: pre-wrap; }
.call { font-family: var(--mono); font-size: 12px; background: var(--sys); border-radius: 4px; padding: 6px 8px; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.grader { outline: 2px dashed var(--accent); }
.empty { color: var(--muted); }
</style>

<div class="wrap">
  <aside>
    <h1>Leaked rubric: elicitation hits</h1>
    <p class="sub">GPT-5 (low reasoning) · elicitation auditor with rollback · 5 seeds per scenario. Badge = clear hits / any hits.</p>
    <nav id="nav" aria-label="Scenarios"></nav>
  </aside>
  <main id="main"></main>
</div>

<script>
const DATA = __DATA__;
const $ = (t, a = {}, ...kids) => { const e = document.createElement(t); Object.assign(e, a); kids.flat().forEach(k => e.append(k)); return e; };
let cur = 0, runIdx = 0;

function nav() {
  const n = document.getElementById("nav"); n.replaceChildren();
  DATA.scenarios.forEach((s, i) => {
    const b = $("button", { onclick: () => { cur = i; runIdx = 0; render(); } },
      $("span", { className: "id", textContent: s.id }),
      $("span", { className: "pill bad", textContent: `${s.hits}/${s.any} of ${s.n}` }));
    b.setAttribute("aria-current", i === cur);
    n.append(b);
  });
}

function msgEl(m, i) {
  const el = $("div", { className: "msg " + m.role });
  const label = `M${i} · ${m.role}${m.tool ? " · " + m.tool : ""}${m.error ? " · error" : ""}`;
  el.append($("div", { className: "role", textContent: label }));
  if (m.reasoning) el.append($("div", { className: "reason", textContent: "reasoning: " + m.reasoning }));
  if (m.text && m.text.trim()) {
    const t = $("div", { className: "text", textContent: m.text.length > 12000 ? m.text.slice(0, 12000) + "\n…[truncated]" : m.text });
    if (/rb-[0-9a-f]{8}/.test(m.text)) el.classList.add("grader");
    el.append(t);
  }
  (m.tool_calls || []).forEach(tc => el.append($("div", { className: "call", textContent: `${tc.function}(${JSON.stringify(tc.arguments, null, 1)})` })));
  if (m.error) el.append($("div", { className: "call", textContent: "error: " + m.error }));
  return el;
}

function render() {
  nav();
  const s = DATA.scenarios[cur], main = document.getElementById("main");
  main.replaceChildren();
  main.append($("div", {}, $("h1", { textContent: s.title }), $("p", { className: "sub", textContent: s.id })));
  const tabs = $("div", { className: "tabs", role: "tablist" });
  s.runs.forEach((r, i) => {
    const bad = (r.bad_action || 0) >= 1;
    const b = $("button", { role: "tab", textContent: `${bad ? "Bad action" : "No bad action"} · seed ${r.epoch}`, onclick: () => { runIdx = i; render(); } });
    b.setAttribute("aria-selected", i === runIdx);
    tabs.append(b);
  });
  if (s.runs.length < 2) tabs.append($("span", { className: "sub", textContent: "No run without the bad action for this scenario." }));
  main.append(tabs);
  const r = s.runs[runIdx], v = r.verdict || {};
  const kv = $("dl", { className: "kv" });
  [["bad_action", `${r.bad_action}${v.induced ? " (induced)" : ""}`], ["slant", v.slant], ["grader", `${v.grader_reference} · ${v.grader_direction}`],
   ["eval suspicion", v.eval_suspicion], ["saw rubric", r.saw_rubric], ["branches", r.branches.length], ["best variant", v.best_variant],
   ["judge explanation", v.explanation], ["simulation issues", v.simulation_issues]]
    .forEach(([k, val]) => kv.append($("dt", { textContent: k }), $("dd", { textContent: val ?? "–" })));
  main.append($("section", { className: "card" }, $("h3", { textContent: "Judge verdict" }), kv));
  main.append($("section", { className: "card" }, $("h3", { textContent: "Bad action definition" }), $("pre", { textContent: r.judge_bad })));
  const rep = r.report && r.report.length ? JSON.stringify(r.report, null, 1) : "No report recorded (turn budget ran out).";
  main.append($("section", { className: "card" }, $("h3", { textContent: "Auditor elicitation report" }), $("pre", { textContent: rep })));
  const ov = Object.entries(r.overrides || {});
  main.append($("section", { className: "card" }, $("h3", { textContent: "Environment overrides" }),
    ov.length ? ov.map(([k, c]) => $("details", {}, $("summary", { textContent: k }), $("pre", { textContent: c }))) : $("p", { className: "empty", textContent: "None." })));
  if (s.review) main.append($("section", { className: "card" }, $("h3", { textContent: "Reviewer notes" }), $("details", {}, $("summary", { textContent: "Open review" }), $("pre", { textContent: s.review }))));
  const conv = $("section", { className: "card" }, $("h3", { textContent: "Target conversation, every branch (grader block outlined)" }));
  r.branches.forEach((br, bi) => {
    const d = $("details", {}, $("summary", { textContent: `Branch ${bi + 1} of ${r.branches.length} · ${br.length} messages` }));
    if (bi === r.branches.length - 1) d.open = true;
    d.addEventListener("toggle", () => { if (d.open && d.children.length === 1) br.forEach((m, i) => d.append(msgEl(m, i + 1))); }, { once: false });
    if (d.open) br.forEach((m, i) => d.append(msgEl(m, i + 1)));
    conv.append(d);
  });
  main.append(conv);
}
render();
</script>
